<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Offline 3D In-Flight Entertainment Moving Map and Cross-Device GPS Telemetry Tracker" />
    <meta name="theme-color" content="#02060d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlightMap" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>FlightMap</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈</text></svg>" />
    <script>
      // Localhost dev guard: never let a leftover service worker serve stale builds.
      // (Phones paired over the LAN address still get the full offline PWA cache.)
      try {
        var hm = location.hostname;
        if (hm === 'localhost' || hm === '127.0.0.1' || hm === '[::1]') {
          if (navigator.serviceWorker) {
            try {
              navigator.serviceWorker.register = function () {
                return Promise.reject(new Error('FlightMap: service worker disabled on localhost'));
              };
            } catch (e) {}
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="canvas-container">
      <canvas id="webgl-canvas"></canvas>
    </div>
    <div id="hud-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
