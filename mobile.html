    <script>
      // Localhost dev guard: never let a leftover service worker serve stale builds.
      try {
        var hm = location.hostname;
        if (hm === 'localhost' || hm === '127.0.0.1' || hm === '[::1]') {
          if (navigator.serviceWorker) {
            try {
              navigator.serviceWorker.register = function () {
                return Promise.reject(new Error('FlightMap: service worker disabled on localhost'));
              };
            } catch (e) {}
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          }
        }
      } catch (e) {}
    </script>
